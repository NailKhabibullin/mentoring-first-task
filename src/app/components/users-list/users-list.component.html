<div class="app-users-list">
    <div class="users-list-container" *ngFor="let user of users">
        <app-user-card 
            [user]="user"
            (deleteUser)="deleteUser($event)"
            (editUser)="editUser(user)">
        </app-user-card>
    </div>
</div>

<div>
    <button class="users-list-container__create-button" mat-raised-button (click)="openDialog()">Create new user</button>
</div>
